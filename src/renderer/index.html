<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'none'" />
  <title>星跃 · 学习通助手</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo"><img src="assets/icon.png" alt="StarLeap" /></div>
        <div class="brand-text">
          <div class="brand-name">星跃</div>
          <div class="brand-sub">StarLeap · 学习通助手</div>
        </div>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-page="dashboard"><span class="nav-ico">◱</span><span>仪表盘</span></button>
        <button class="nav-item" data-page="courses"><span class="nav-ico">❑</span><span>课程中心</span></button>
        <button class="nav-item" data-page="tasks"><span class="nav-ico">⚙</span><span>任务队列</span><span id="nav-queue-badge" class="nav-badge hidden">0</span></button>
        <button class="nav-item" data-page="answers"><span class="nav-ico">✎</span><span>答题中心</span><span id="nav-answer-badge" class="nav-badge hidden">0</span></button>
        <button class="nav-item" data-page="browser"><span class="nav-ico">☰</span><span>辅助浏览器</span></button>
        <button class="nav-item" data-page="settings"><span class="nav-ico">✿</span><span>设置</span></button>
      </nav>
      <div class="sidebar-footer">
        <div id="sidebar-user" class="sidebar-user hidden">
          <div class="user-avatar" id="user-avatar">?</div>
          <div class="user-meta">
            <div class="user-name" id="user-name">未登录</div>
            <div class="user-school" id="user-school"></div>
          </div>
        </div>
        <div class="engine-state" id="engine-state">
          <span class="state-dot" id="state-dot"></span><span id="state-text">空闲</span>
        </div>
      </div>
    </aside>

    <!-- 主区域 -->
    <main id="main">
      <header id="topbar">
        <div class="topbar-drag"></div>
        <div class="topbar-title" id="page-title">仪表盘</div>
        <div class="topbar-actions">
          <button id="btn-queue-toggle" class="btn btn-primary">启动刷课</button>
        </div>
      </header>

      <section id="page-container">
        <!-- 仪表盘 -->
        <div class="page active" id="page-dashboard"></div>
        <!-- 课程中心 -->
        <div class="page" id="page-courses"></div>
        <!-- 任务队列 -->
        <div class="page" id="page-tasks"></div>
        <!-- 答题中心 -->
        <div class="page" id="page-answers"></div>
        <!-- 辅助浏览器 -->
        <div class="page" id="page-browser"></div>
        <!-- 设置 -->
        <div class="page" id="page-settings"></div>
      </section>
    </main>
  </div>

  <!-- 弹层 -->
  <div id="toast-container"></div>
  <div id="modal-root" class="hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
